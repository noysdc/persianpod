<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/persianpod.css' | relative_url }}">
</head>
<body>
  <header class="site-head">
    <a class="brand" href="{{ '/' | relative_url }}">پرشین‌پاد</a>
    <nav>
      <a href="{{ '/' | relative_url }}">پادکست‌ها</a>
      <a href="{{ '/about-us/' | relative_url }}">درباره‌ی ما</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer class="site-foot">
    <p>رایگان، بدون تبلیغ و بدون جایگاه ویژه. برای ثبت پادکست یا درخواست حذف: <a href="mailto:submit@persianpod.ir">submit@persianpod.ir</a></p>
  </footer>
</body>
</html>
