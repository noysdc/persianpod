<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <meta name="theme-color" content="#1B2340">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/persianpod-icon.svg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <script>(function(){try{var d=document.documentElement,t=localStorage.getItem('pp-theme');if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';d.setAttribute('data-theme',t);var f=parseFloat(localStorage.getItem('pp-fs'));if(f)d.style.setProperty('--fs',f)}catch(e){}})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/persianpod.css' | relative_url }}">
  <script src="{{ '/assets/js/logo.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/ui.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip" href="#main">رفتن به محتوا</a>
  <header class="site-head">
    <div class="bar">
      <a class="brand" href="{{ '/' | relative_url }}">{% include pp-logo.html %}<span>پرشین‌پاد</span></a>
      <nav aria-label="منوی اصلی">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>پادکست‌ها</a>
        <a href="{{ '/listen/' | relative_url }}"{% if page.url == '/listen/' %} aria-current="page"{% endif %}>گوش بده</a>
        <a href="{{ '/learn/' | relative_url }}"{% if page.url == '/learn/' %} aria-current="page"{% endif %}>آموزش</a>
        <a href="{{ '/about-us/' | relative_url }}"{% if page.url == '/about-us/' %} aria-current="page"{% endif %}>درباره‌ی ما</a>
      </nav>
      <form class="search" role="search" action="{{ '/' | relative_url }}" method="get">
        <input type="search" id="q" name="q" placeholder="جست‌وجوی پادکست" aria-label="جست‌وجوی پادکست">
      </form>
      <div class="tools">
        <button type="button" id="t-theme" aria-label="تغییر حالت شب و روز" title="حالت شب و روز">
          <svg class="i i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          <svg class="i i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" id="t-fs-minus" aria-label="کوچک‌کردن متن" title="کوچک‌کردن متن"><span aria-hidden="true">A−</span></button>
        <button type="button" id="t-fs-plus" aria-label="بزرگ‌کردن متن" title="بزرگ‌کردن متن"><span aria-hidden="true">A+</span></button>
        <button type="button" id="t-read" aria-pressed="false" aria-label="حالت مطالعه" title="حالت مطالعه">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v14"/></svg>
        </button>
        <a href="https://t.me/persian_pod" target="_blank" rel="noopener" aria-label="کانال تلگرام" title="کانال تلگرام">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 3 2 11l6 2 2 7 4-5 6 4z"/></svg>
        </a>
        <a href="mailto:contact@persianpod.ir" aria-label="ایمیل" title="contact@persianpod.ir">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        </a>
      </div>
    </div>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-foot">
    <p>رایگان و بدون جایگاه ویژه.</p>
    <p><a href="https://t.me/persian_pod" target="_blank" rel="noopener">کانال تلگرام</a> | <a href="mailto:contact@persianpod.ir">contact@persianpod.ir</a></p>
  </footer>
</body>
</html>
