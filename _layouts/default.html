<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:locale" content="fa_IR">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/mark-2x2.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body data-search="{{ '/search.json' | relative_url }}">
<header class="top">
  <a class="brand" href="{{ '/' | relative_url }}"><svg class="mk" width="40" height="8" viewBox="0 0 40 8" aria-hidden="true"><rect width="8" height="8" fill="currentColor" opacity=".3"/><rect x="11" width="8" height="8" fill="currentColor" opacity=".3"/><rect x="22" width="8" height="8" fill="#08CB00"/><rect x="33" width="8" height="8" fill="currentColor" opacity=".3"/></svg>پرشین‌پاد</a>
  <nav><a href="{{ '/' | relative_url }}">پادکست‌ها</a><a href="{{ '/listen/' | relative_url }}">گوش بده</a><a href="{{ '/learn/' | relative_url }}">آموزش</a><a href="{{ '/about-us/' | relative_url }}">درباره‌ی ما</a></nav>
</header>
<main>{{ content }}</main>
<footer>رایگان، بدون تبلیغ و بدون جایگاه ویژه. برای ثبت پادکست یا درخواست حذف: <a href="mailto:{{ site.email }}">{{ site.email }}</a></footer>
<script src="{{ '/assets/js/player.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
</body>
</html>
