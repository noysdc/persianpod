name: 12 Fetch learn covers [auto, on learn changes + weekly]

# کاور آموزش‌هایی را که عکس ندارند خودکار می‌گیرد.
# اجرا می‌شود: وقتی فایل آموزش‌ها عوض شود، هر هفته، و هر وقت دستی «Run workflow» بزنی.
on:
  push:
    paths:
      - "_data/learn_links.yml"
      - "_learn/**"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-learn-covers
  cancel-in-progress: false

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_learn_covers.py
      - name: Commit changes
        run: |
          git config user.name  "persianpod-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A _data assets/img
          if [ -d _learn ]; then git add -A _learn; fi
          git diff --cached --quiet && exit 0
          git commit -m "chore: add learn covers"
          # ربات RSS هر ۱۰ دقیقه push می‌کند؛ بدون تکرار، این push گاهی رد می‌شد
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 6))
          done
          exit 1
