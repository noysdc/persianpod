name: Update RSS stats

on:
  schedule:
    - cron: "*/10 * * * *"   # هر ۱۰ دقیقه (گیت‌هاب ممکن است چند دقیقه دیرتر اجرا کند)
  workflow_dispatch:           # اجرای دستی از تب Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/update_rss.py
      - name: Commit changes
        run: |
          git config user.name  "persianpod-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _data/rss_stats.json _data/rss_errors.json
          git diff --cached --quiet || (git commit -m "chore: update RSS stats" && git pull --rebase && git push)
