name: 09 Tool - fix page footer note [manual, one-off]
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fix-old-note
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: اجرای اصلاح
        run: node scripts/fix-old-note.mjs
      - name: ذخیره
        run: |
          git config user.name "persianpod-bot"
          git config user.email "persianpod-bot@users.noreply.github.com"
          git add -A _podcasts _drafts _blocked
          if git diff --cached --quiet; then
            echo "چیزی برای کامیت نیست"
            exit 0
          fi
          git commit -m "chore: اصلاح متن پایین صفحه‌ها"
          git push