name: Podcast locations — پیشنهاد مکان از فید

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  locations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pyyaml

      - run: python scripts/podcast_location.py

      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .github/location_suggestions.json
          git diff --cached --quiet || git commit -m "chore: update location suggestions"
          git push
