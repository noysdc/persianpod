name: Podcast Index — شناسایی کامل از دامپ (یک‌بار یا ماهانه)
# دامپ کامل Podcast Index (فایل SQLite، چند گیگابایت) را می‌گیرد و همه‌ی پادکست‌های فارسی را به _data/pi/feeds.json اضافه می‌کند.
# اجرای روزانه‌ی pi-discover فقط با کلیدواژه می‌گردد و پادکست‌هایی مثل «رخ» یا «جافکری» را نمی‌بیند؛ این‌جا همه‌شان پیدا می‌شوند.
on:
  schedule:
    - cron: "0 2 1 * *"      # روز اول هر ماه
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pi-discover
  cancel-in-progress: false
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: دریافت و بازکردن دامپ
        run: |
          df -h . | tail -1
          curl -L --fail --retry 4 --retry-delay 20 https://public.podcastindex.org/podcastindex_feeds.db.tgz | tar -xz
          ls -la podcastindex_feeds.db
      - name: بیرون کشیدن پادکست‌های فارسی
        run: |
          python3 scripts/pi-from-dump.py podcastindex_feeds.db | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f podcastindex_feeds.db
      - name: ذخیره
        run: |
          git config user.name "persianpod-bot"
          git config user.email "persianpod-bot@users.noreply.github.com"
          git add _data/pi/feeds.json
          git diff --cached --quiet || (git commit -m "data: افزودن پادکست‌های فارسی از دامپ کامل Podcast Index" && git pull --rebase && git push)
