name: تأیید صفحه‌های خودکار
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "نام صفحه‌ها با ویرگول (مثلاً: zangetarikh,noys) یا کلمه‌ی all برای همه‌ی تأییدنشده‌ها"
        required: true
permissions:
  contents: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: تأیید
        run: node scripts/pi-approve.mjs
        env:
          SLUGS: ${{ inputs.slugs }}
      - name: ذخیره
        run: |
          cat _data/pi/approve-report.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "persianpod-bot"
          git config user.email "persianpod-bot@users.noreply.github.com"
          git add -A _podcasts _data/pi
          git diff --cached --quiet || (git commit -m "data: تأیید صفحه‌های خودکار" && git pull --rebase && git push)
