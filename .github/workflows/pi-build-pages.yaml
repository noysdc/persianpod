name: Podcast Index — ساخت و تأیید صفحه‌ها
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "حالت اجرا"
        type: choice
        default: build
        options:
          - build     # ساخت پادکست‌های جدید در _drafts/
          - approve   # انتقال همه‌ی _drafts/ به _podcasts/ و انتشار
      limit:
        description: "حداکثر چند پادکست تازه (فقط در حالت build)"
        default: "80"
      ids:
        description: "اختیاری: pi_idها با ویرگول (فقط در حالت build)"
        default: ""
      sort:
        description: "ترتیب انتخاب (فقط در حالت build)"
        type: choice
        default: episodes
        options: [episodes, recent]
permissions:
  contents: write
concurrency:
  group: pi-build-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: نصب sharp (تبدیل لوگو به webp)
        run: npm install sharp --no-save --no-package-lock
      - name: ساخت پادکست‌های جدید
        if: ${{ inputs.mode != 'approve' }}
        run: node scripts/pi-build-pages.mjs
        env:
          PI_KEY: ${{ secrets.PODCASTINDEX_KEY }}
          PI_SECRET: ${{ secrets.PODCASTINDEX_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_MODEL: ${{ vars.GH_MODEL || 'openai/gpt-oss-120b' }}
          CLASSIFY: "1"
          AI_BUDGET: "130"
          LIMIT: ${{ inputs.limit || '80' }}
          SORT: ${{ inputs.sort || 'episodes' }}
          IDS: ${{ inputs.ids }}
      - name: تأیید و انتقال drafts به podcasts
        if: ${{ inputs.mode == 'approve' }}
        run: node scripts/pi-approve.mjs
      - name: گزارش و ذخیره
        run: |
          if [ -f _data/pi/build-report.md ]; then
            cat _data/pi/build-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f _data/pi/approve-report.md ]; then
            cat _data/pi/approve-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          git config user.name "persianpod-bot"
          git config user.email "persianpod-bot@users.noreply.github.com"
          git add -A _podcasts _drafts assets/img/podcasts _data/pi
          git diff --cached --quiet || (git commit -m "data: به‌روزرسانی پادکست‌ها" && git pull --rebase && git push)