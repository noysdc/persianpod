name: Podcast Index — ساخت صفحه‌های جدید (مرحله ۳)
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "حداکثر چند پادکست تازه در این اجرا؟"
        default: "80"
      ids:
        description: "اختیاری: pi_idها با ویرگول"
        default: ""
      publish:
        description: "منتشر شوند؟"
        type: boolean
        default: false
      sort:
        description: "ترتیب انتخاب"
        type: choice
        default: episodes
        options: [episodes, recent]
permissions:
  contents: write
concurrency:
  group: pi-build-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: نصب sharp
        run: npm install sharp --no-save --no-package-lock
      - name: ساخت صفحه‌ها
        run: node scripts/pi-build-pages.mjs
        env:
          PI_KEY: ${{ secrets.PODCASTINDEX_KEY }}
          PI_SECRET: ${{ secrets.PODCASTINDEX_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_MODEL: ${{ vars.GH_MODEL || 'openai/gpt-oss-120b' }}
          CLASSIFY: "1"
          AI_BUDGET: "130"
          PUBLISH: ${{ inputs.publish && '1' || vars.PI_AUTO_PUBLISH || '0' }}
          LIMIT: ${{ inputs.limit || '80' }}
          SORT: ${{ inputs.sort || 'episodes' }}
          IDS: ${{ inputs.ids }}
      - name: گزارش و ذخیره
        run: |
          cat _data/pi/build-report.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "persianpod-bot"
          git config user.email "persianpod-bot@users.noreply.github.com"
          git add -A _podcasts assets/img/podcasts _data/pi
          git diff --cached --quiet || (git commit -m "data: صفحه‌های جدید از Podcast Index" && git pull --rebase && git push)