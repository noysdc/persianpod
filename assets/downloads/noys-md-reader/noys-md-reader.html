:root{--bg:#0f1115;--bg2:#161a22;--bg3:#1e2430;--fg:#e8eaf0;--fg2:#a8b0c0;--fg3:#6b7385;--acc:#c9a227;--acc2:#e8c547;--border:#2a3140;--mark:#e8c54766;--fs:18px;--lh:2;--font:'Vazirmatn',system-ui,sans-serif}
[data-theme=light]{--bg:#f7f8fa;--bg2:#fff;--bg3:#eef0f5;--fg:#1a1d24;--fg2:#4a5160;--fg3:#8890a0;--acc:#b8860b;--acc2:#9a6f00;--border:#dde1ea;--mark:#ffd54f99}
[data-theme=sepia]{--bg:#f4ecd8;--bg2:#faf3e3;--bg3:#ebe2cc;--fg:#3a2f1f;--fg2:#5c4a30;--fg3:#8a7555;--acc:#8a6d1f;--acc2:#6f5512;--border:#d8c9a8;--mark:#e0b84a88}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:var(--fs);line-height:var(--lh);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);transition:background .3s,color .3s}
button,input,textarea{font-family:inherit}
#progress{position:fixed;top:0;right:0;height:3px;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));z-index:99}
#top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 14px;display:none}
#top .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:900px;margin:0 auto}
#top .row+.row{margin-top:8px}
.brand{font-weight:800;color:var(--acc2);margin-inline-end:auto;font-size:1.05rem;letter-spacing:.5px}
.tb{background:var(--bg3);color:var(--fg2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:.8rem;cursor:pointer;white-space:nowrap;line-height:1.7}
.tb:hover,.tb.on{background:var(--acc);color:#111;border-color:var(--acc)}
#q{flex:1;min-width:140px;padding:7px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--fg);font-size:.9rem}
#q:focus,textarea:focus{outline:none;border-color:var(--acc)}
#cnt{font-size:.78rem;color:var(--fg3);min-width:48px;text-align:center}
.chip{border:1px solid var(--border);background:transparent;color:var(--fg2);border-radius:20px;padding:2px 10px;font-size:.74rem;cursor:pointer;line-height:1.8;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
#chips{max-height:78px;overflow:auto}
#loader{max-width:720px;margin:0 auto;padding:40px 16px}
#loader h1{color:var(--acc2);font-size:1.6rem;margin-bottom:6px}
#loader p.s{color:var(--fg2);font-size:.9rem;line-height:1.9;margin-bottom:20px}
#drop{border:2px dashed var(--border);border-radius:14px;padding:34px 16px;text-align:center;color:var(--fg2);cursor:pointer;background:var(--bg2);transition:.2s}
#drop.over,#drop:hover{border-color:var(--acc);color:var(--acc2)}
#drop b{display:block;font-size:1.1rem;margin-bottom:4px}
#paste{width:100%;height:150px;margin-top:16px;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--fg);font-size:.9rem;direction:auto;resize:vertical}
.go{margin-top:12px;background:var(--acc);color:#111;border:0;border-radius:10px;padding:9px 22px;font-weight:700;cursor:pointer;font-size:.95rem}
.opt{margin-top:16px;font-size:.85rem;color:var(--fg2)}
.opt select{background:var(--bg3);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-family:inherit}
#viewer{display:none;max-width:860px;margin:18px auto 0;padding:0 16px}
#dtitle{font-size:1.5em;font-weight:800;color:var(--acc2);margin-bottom:4px;line-height:1.6}
#dmeta{font-size:.78rem;color:var(--fg3);margin-bottom:18px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 20px 18px;margin-bottom:16px;transition:border-color .2s,box-shadow .2s}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.card.off,.card.nomatch,body.onlysel .card:not(.sel){display:none}
.bar{display:flex;gap:8px;align-items:center;font-size:.75rem;color:var(--fg3);margin-bottom:6px;direction:rtl}
.bar label{cursor:pointer;display:flex;gap:5px;align-items:center}
.bar .sp{flex:1}
.bar input{accent-color:var(--acc);width:16px;height:16px}
.mini{background:none;border:1px solid var(--border);color:var(--fg2);border-radius:6px;padding:1px 9px;cursor:pointer;font-size:.74rem}
.mini:hover,.mini.has{border-color:var(--acc);color:var(--acc2)}
.body{overflow-wrap:anywhere}
.body h1,.body h2,.body h3,.body h4{color:var(--acc2);line-height:1.6;margin:.2em 0 .5em}
.body h1{font-size:1.5em}.body h2{font-size:1.3em}.body h3{font-size:1.15em}.body h4{font-size:1.05em}
.body p{margin-bottom:.8em}
.body ul,.body ol{margin:0 1.4em .8em;padding:0}

    var whitespace = node.flankingWhitespace;
    if (whitespace.leading || whitespace.trailing) content = content.trim();
    return (
      whitespace.leading +
      rule.replacement(content, node, this.options) +
      whitespace.trailing
    )
  }

  /**
   * Joins replacement to the current output with appropriate number of new lines
   * @private
   * @param {String} output The current conversion output
   * @param {String} replacement The string to append to the output
   * @returns Joined output
   * @type String
   */

  function join (output, replacement) {
    var s1 = trimTrailingNewlines(output);
    var s2 = trimLeadingNewlines(replacement);
    var nls = Math.max(output.length - s1.length, replacement.length - s2.length);
    var separator = '\n\n'.substring(0, nls);

    return s1 + separator + s2
  }

  /**
   * Determines whether an input can be converted
   * @private
   * @param {String|HTMLElement} input Describe this parameter
   * @returns Describe what it returns
   * @type String|Object|Array|Boolean|Number
   */

  function canConvert (input) {
    return (
      input != null && (
        typeof input === 'string' ||
        (input.nodeType && (
          input.nodeType === 1 || input.nodeType === 9 || input.nodeType === 11
        ))
      )
    )
  }

  return TurndownService;

})));

const gp=$('#gpop'),gP=$('#gP'),gM=$('#gM'),gpan=$('#gpanel');let gcur=null;
const gdef=w=>gl[w]||inl[w]||{};
function applyGl(c){c.querySelectorAll('.gw').forEach(s=>{const d=gdef(s.dataset.w);s.classList.toggle('has-d',!!(d.p||d.m));if(d.p)s.dataset.p=d.p;else delete s.dataset.p;if(d.m)s.title=d.m;else s.removeAttribute('title')})}
function gwords(){const m=new Map();cards.forEach(c=>c.querySelectorAll('.gw').forEach(s=>{const w=s.dataset.w;m.set(w,(m.get(w)||0)+1)}));return m}
function glRefresh(){cards.forEach(applyGl);const n=gwords().size;$('#gc').textContent=n?fn(n):''}
function gset(w,p,m){p=(p||'').trim();m=(m||'').trim();if(p||m||inl[w])gl[w]={p,m};else delete gl[w];LS.set('gl-'+KEY,JSON.stringify(gl));glRefresh()}
document.addEventListener('click',e=>{const s=e.target.closest&&e.target.closest('.gw');if(!s||tele())return;
 gcur=s.dataset.w;const d=gdef(gcur);gp.querySelector('.gt').textContent=gcur;gP.value=d.p||'';gM.value=d.m||'';gp.style.display='flex';
 const r=s.getBoundingClientRect();gp.style.top=Math.min(innerHeight-270,Math.max(80,r.bottom+8))+'px';gp.style.left=Math.max(6,Math.min(innerWidth-gp.offsetWidth-6,r.left))+'px'});
document.addEventListener('mousedown',e=>{if(!e.target.closest('#gpop,.gw'))gp.style.display='none'});
gP.oninput=gM.oninput=()=>gset(gcur,gP.value,gM.value);
$('#gX').onclick=()=>{gp.style.display='none'};
$('#gL1').onclick=()=>window.open('https://www.vajehyab.com/?q='+encodeURIComponent(gcur),'_blank','noopener');
$('#gL2').onclick=()=>window.open('https://www.google.com/search?q='+encodeURIComponent('معنی و تلفظ '+gcur),'_blank','noopener');
function drawG(){const m=gwords(),L=$('#gList');$('#gn').textContent=fn(m.size)+' واژه';$('#gShow').checked=!!S.showp;L.innerHTML='';
 if(!m.size){L.innerHTML='<p class="gm">واژه‌ای با [[ ]] در متن پیدا نشد. مثال: [[کفاله]] یا [[کفاله|کَفاله|نظام اسپانسری]]</p>';return}
 m.forEach((n,w)=>{const d=gdef(w),r=document.createElement('div');r.className='gr';
  r.innerHTML='<div class="gw0"><b></b><small>'+fn(n)+'×</small><button class="mini">برو به متن</button></div><input placeholder="تلفظ"><textarea placeholder="معنی"></textarea>';
  r.querySelector('b').textContent=w;const i=r.querySelector('input'),t=r.querySelector('textarea');i.value=d.p||'';t.value=d.m||'';
  i.oninput=t.oninput=()=>gset(w,i.value,t.value);
  r.querySelector('.mini').onclick=()=>{gpan.style.display='none';const el=[...document.querySelectorAll('.gw')].find(s=>s.dataset.w===w);if(el){el.scrollIntoView({block:'center'});el.classList.add('gflash');setTimeout(()=>el.classList.remove('gflash'),1600)}};
  L.append(r)})}
$('#bGl').onclick=()=>{drawG();gpan.style.display='flex'};
$('#gClose').onclick=()=>{gpan.style.display='none'};gpan.onmousedown=e=>{if(e.target===gpan)gpan.style.display='none'};
$('#gShow').onchange=e=>{S.showp=e.target.checked?1:0;applyS()};
$('#gCopy').onclick=()=>{const L=[...gwords().keys()].map(w=>{const d=gdef(w);return w+' | '+(d.p||'')+' | '+(d.m||'')});
 if(!L.length)return toast('واژه‌ای نیست');
 copy('برای هر واژه‌ی زیر، تلفظ دقیق فارسی (با اعراب‌گذاری) و معنی کوتاه را بنویس. خروجی را دقیقاً به شکل «واژه | تلفظ | معنی» و در یک خط برای هر واژه بده و چیز دیگری ننویس:\n\n'+L.join('\n'),'لیست با دستورالعمل کپی شد ✓')};
$('#gCopyAll').onclick=()=>{const L=[...gwords().keys()].map(w=>{const d=gdef(w);return w+' | '+(d.p||'')+' | '+(d.m||'')});L.length?copy(L.join('\n'),'واژه‌نامه کپی شد ✓'):toast('واژه‌ای نیست')};
$('#gImp').onclick=()=>{const b=$('#gImpBox');b.style.display=b.style.display==='none'?'block':'none'};
$('#gApply').onclick=()=>{const m=gwords();let n=0;$('#gIn').value.split('\n').forEach(l=>{const q=l.split('|').map(x=>x.trim());if(q.length>=2&&m.has(q[0])){gset(q[0],q[1],q.slice(2).join(' | '));n++}});
 toast(fn(n)+' واژه به‌روز شد');drawG();$('#gIn').value='';$('#gImpBox').style.display='none'};

/* loader */
function normTxt(t){const pa=t.split(/\n\s*\n/).filter(x=>x.trim()).length,ln=t.split('\n').filter(x=>x.trim()).length;
 return(pa<=2&&ln>4)?t.split('\n').filter(x=>x.trim()).join('\n\n'):t}
function prep(md,lvl){md=md.replace(/\r\n?/g,'\n');let fence=false,hc=0;
 md.split('\n').forEach(l=>{if(/^\s*(```|~~~)/.test(l))fence=!fence;if(!fence&&/^#{1,3}\s+\S/.test(l))hc++});
 if(hc>=2)return md;
 let head='';const m=hc===1&&md.match(/^\s*(#\s+[^\n]+)\n/);if(m){head=m[1]+'\n\n';md=md.slice(m[0].length)}
 const hr=/^\s*([-*_])(\s*\1){2,}\s*$/;let parts=[[]];fence=false;
 md.split('\n').forEach(l=>{if(/^\s*(```|~~~)/.test(l))fence=!fence;if(!fence&&hr.test(l))parts.push([]);else parts[parts.length-1].push(l)});
 parts=parts.map(a=>a.join('\n').trim()).filter(Boolean);
 if(parts.length<2){const ch=Math.max(1,+$('#chunk').value||6),bl=md.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);parts=[];for(let i=0;i<bl.length;i+=ch)parts.push(bl.slice(i,i+ch).join('\n\n'))}
 if(parts.length<2&&!head)return md;
 const hs='#'.repeat(Math.min(3,Math.max(1,lvl)));
 return head+parts.map((s,i)=>hs+' بخش '+fn(i+1)+'\n\n'+s).join('\n\n')}
function docxMd(html){const td=new TurndownService({headingStyle:'atx',bulletListMarker:'-',emDelimiter:'*',codeBlockStyle:'fenced'});
 td.escape=s=>s;td.keep(['table','thead','tbody','tr','td','th']);td.addRule('noimg',{filter:'img',replacement:()=>''});return td.turndown(html)}
async function load(file){const n=file.name||'',ext=(n.split('.').pop()||'').toLowerCase(),lvl=+$('#lvl').value;
 try{const ab=await file.arrayBuffer(),u=new Uint8Array(ab);
  if(ext==='docx'||(u[0]===0x50&&u[1]===0x4B)){
   if(!window.mammoth||!window.TurndownService)return toast('کتابخانه ورد در دسترس نیست');
   const r=await mammoth.convertToHtml({arrayBuffer:ab},{styleMap:["p[style-name='Title'] => h1:fresh"]});
   const md=docxMd(r.value);if(!md.trim())return toast('متنی در فایل ورد پیدا نشد');
   return render(prep(md,lvl),n,lvl)}
  if(ext==='doc')return toast('فرمت قدیمی .doc پشتیبانی نمی‌شود؛ در ورد با Save As آن را به .docx تبدیل کنید');
  let t;if(u[0]===0xFF&&u[1]===0xFE)t=new TextDecoder('utf-16le').decode(ab);
  else{try{t=new TextDecoder('utf-8',{fatal:true}).decode(ab)}catch(e){t=new TextDecoder('windows-1256').decode(ab)}}
  t=t.replace(/^\uFEFF/,'');if(ext==='txt')t=normTxt(t);
  render(prep(t,lvl),n,lvl)}catch(e){toast('فایل خوانده نشد')}}
const drop=$('#drop');drop.onclick=()=>$('#file').click();
$('#file').onchange=e=>{if(e.target.files[0])load(e.target.files[0])};
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
document.addEventListener('drop',e=>{if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])});
$('#goBtn').onclick=()=>{const v=$('#paste').value;v.trim()?render(prep(v,+$('#lvl').value),'',+$('#lvl').value):toast('متنی وارد نشده')};

/* search (digits, ی/ي, ک/ك, harakat, ZWNJ tolerant) */
function pat(q){const opt='[\\u064B-\\u065F\\u0670\\u0640\\u200c\\u200d]*';let o='';
 for(const ch of q.replace(/[\u064B-\u065F\u0670\u0640\u200c\u200d]/g,'')){
  if(/\s/.test(ch)){o+='\\s+';continue}
  o+=(/[0-9۰-۹٠-٩]/.test(ch)?'[0-9۰-۹٠-٩]':/[یيى]/.test(ch)?'[یيى]':/[کك]/.test(ch)?'[کك]':ch.replace(/[\\^$.*+?()[\]{}|\/-]/g,'\\$&'))+opt}
 return o}
function cnt(){$('#cnt').textContent=marks.length?fn(cur+1)+'/'+fn(marks.length):''}
function search(q){cards.forEach(c=>{const b=c.querySelector('.body');b.innerHTML=b._orig;applyPn(c);applyGl(c);c.classList.remove('nomatch')});
 marks=[];cur=-1;q=q.trim();if(!q){cnt();return}
 let re;try{re=new RegExp('('+pat(q)+')','gi')}catch(e){return}
 cards.forEach(c=>{const b=c.querySelector('.body'),w=document.createTreeWalker(b,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const parts=n.data.split(re);if(parts.length<2)return;const f=document.createDocumentFragment();
   parts.forEach((p,i)=>{if(i%2){const m=document.createElement('mark');m.textContent=p;f.append(m)}else f.append(p)});n.replaceWith(f)});
  const ms=b.querySelectorAll('mark');c.classList.toggle('nomatch',!ms.length);marks.push(...ms)});
 if(marks.length)go(1);else cnt()}
function go(d){if(!marks.length)return;if(cur>=0&&marks[cur])marks[cur].classList.remove('cur');
 cur=(cur+d+marks.length)%marks.length;const m=marks[cur];m.classList.add('cur');m.scrollIntoView({block:'center',behavior:'smooth'});cnt()}
let st;$('#q').oninput=e=>{clearTimeout(st);st=setTimeout(()=>{search(e.target.value);if(marks.length){cur=0;marks[0].classList.add('cur');cnt()}},200)};
$('#q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go(e.shiftKey?-1:1)}};
$('#bNext').onclick=()=>go(1);$('#bPrev').onclick=()=>go(-1);

/* teleprompter */
let playing=false,raf=0,pos=0,last=0;const tele=()=>document.body.classList.contains('tele');
function loop(t){if(!playing)return;const dt=Math.min(.1,(t-last)/1000);last=t;pos+=S.tsp*dt;scrollTo(0,pos);
 if(pos>=document.documentElement.scrollHeight-innerHeight-2)setPlay(false);else raf=requestAnimationFrame(loop)}
function setPlay(p){playing=p;$('#tPlay').textContent=p?'⏸':'▶';cancelAnimationFrame(raf);if(p){pos=scrollY;last=performance.now();raf=requestAnimationFrame(loop)}}
function enterTele(){hideBar();document.body.classList.add('tele');document.documentElement.style.scrollBehavior='auto';
 try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}toast('Space = شروع/توقف · ↑↓ = سرعت · Esc = خروج')}
function exitTele(){setPlay(false);document.body.classList.remove('tele');document.documentElement.style.scrollBehavior='';
 try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}
$('#bTele').onclick=enterTele;$('#tExit').onclick=exitTele;$('#tPlay').onclick=()=>setPlay(!playing);
const spd=d=>{S.tsp=Math.min(300,Math.max(5,S.tsp+d));applyS()};$('#tSlow').onclick=()=>spd(-5);$('#tFast').onclick=()=>spd(5);
addEventListener('wheel',()=>{if(playing)pos=scrollY},{passive:true});addEventListener('touchmove',()=>{if(playing)pos=scrollY},{passive:true});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&tele())exitTele()});

/* shortcuts */
function jump(d){const v=cards.filter(c=>c.offsetParent);if(!v.length)return;
 const y=v.map(c=>c.getBoundingClientRect().top);let i=d>0?y.findIndex(t=>t>80):(()=>{let k=-1;y.forEach((t,j)=>{if(t<-20)k=j});return k})();
 if(i<0)i=d>0?v.length-1:0;v[i].scrollIntoView()}
document.addEventListener('keydown',e=>{const ed=/INPUT|TEXTAREA/.test(e.target.tagName);
 if((e.ctrlKey||e.metaKey)&&e.key==='f'&&$('#top').style.display==='block'&&!tele()){e.preventDefault();$('#q').focus();$('#q').select();return}
 if(ed)return;
 if(tele()){if(e.key===' '){e.preventDefault();setPlay(!playing)}else if(e.key==='ArrowUp'){e.preventDefault();spd(5)}else if(e.key==='ArrowDown'){e.preventDefault();spd(-5)}else if(e.key==='Escape')exitTele();return}
 if($('#viewer').style.display!=='block')return;
 if(e.key==='n')jump(1);else if(e.key==='p')jump(-1);else if(e.key==='t')enterTele()});

/* auto-hide top bar */
let ly=0,tk=false;addEventListener('scroll',()=>{if(tk)return;tk=true;requestAnimationFrame(()=>{tk=false;const y=scrollY,t=$('#top'),d=y-ly;
 const keep=document.activeElement===$('#q')||marks.length||menu.classList.contains('open')||tele();
 if(keep||y<80||d<-6)t.classList.remove('hide');else if(d>10)t.classList.add('hide');ly=y})},{passive:true});
/* progress + position memory */
let pt;addEventListener('scroll',()=>{const h=document.documentElement,m=Math.max(1,h.scrollHeight-h.clientHeight);$('#progress').style.width=(h.scrollTop/m*100)+'%';
 if(lock||!KEY||$('#viewer').style.display!=='block')return;clearTimeout(pt);pt=setTimeout(()=>LS.set('pos-'+KEY,(h.scrollTop/m).toFixed(4)),400)});

/* preloaded (saved) file */
const pre=document.getElementById('preload');
if(pre&&pre.textContent.trim()){try{const d=JSON.parse(b64d(pre.textContent.trim()));
 LS.set('notes-'+hash(d.md),JSON.stringify(d.notes||{}));LS.set('hl-'+hash(d.md),JSON.stringify(d.hl||{}));LS.set('pn-'+hash(d.md),JSON.stringify(d.pn||{}));LS.set('gl-'+hash(d.md),JSON.stringify(d.gl||{}));$('#lvl').value=d.lvl||'2';render(d.md,d.name,+(d.lvl||2))}catch(e){}}
else drawLib();
})();
