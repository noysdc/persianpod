name: Link check
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # every Monday
  push:
    branches: [master]
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - run: bundle exec jekyll build
      - name: Check links in built site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --max-retries 2
            --accept 200,206,403,429
            --exclude 'cdn-cgi' --exclude 'instagram.com' --exclude 't.me'
            --root-dir "${{ github.workspace }}/_site"
            './_site/**/*.html'
          fail: true
