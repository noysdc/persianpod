title: پرشین‌پاد
description: پایگاه داده‌ی رایگان و بدون تبلیغ پادکست‌های فارسی
lang: fa
url: https://persianpod.ir
baseurl: ""
email: contact@persianpod.ir
telegram: https://t.me/persian_pod_ir
donate: https://daramet.com/NOYS
timezone: Asia/Tehran
markdown: kramdown
plugins:
  - jekyll-sitemap
collections:
  podcasts:
    output: true
    permalink: /podcasts/:name/
defaults:
  - scope: { path: "", type: "podcasts" }
    values: { layout: "podcast" }
exclude: [README.md, LICENSE, Gemfile, Gemfile.lock, node_modules, scripts, tools, "*.patch", "*.tar.gz", DELETE-LIST.txt, delete-unused-files.sh]
# آمار RSS تازه‌ترین نسخه؛ صفحه‌ی «تازه‌ها» از اینجا می‌خواند تا منتظر دیپلوی دوباره نماند
rss_stats_raw: https://raw.githubusercontent.com/noysdc/persianpod/master/_data/rss_stats.json
