layout: default
title: پادکست‌ها
permalink: /podcasts/
---
<link rel="stylesheet" href="{{ '/assets/css/pp-search.css' | relative_url }}">

<section class="pp-directory" dir="rtl">
  <h1>پادکست‌های فارسی</h1>

  <form id="pp-filters" class="pp-filters pp-card" autocomplete="off" role="search">
    <label class="pp-wide">جستجو (نام، توضیح، موضوع)
      <input type="search" id="f-q" placeholder="مثلاً: تاریخ، روان‌شناسی، فناوری">
    </label>

    <label>دسته
      <select id="f-category"><option value="">همه</option></select>
    </label>
    <label>شهر
      <select id="f-city"><option value="">همه</option></select>
    </label>
    <label>وضعیت
      <select id="f-status">
        <option value="">همه</option>
        <option value="active">فعال</option>
        <option value="inactive">غیرفعال</option>
      </select>
    </label>

    <label>سال شروع، از
      <select id="f-year-from"><option value="">—</option></select>
    </label>
    <label>تا
      <select id="f-year-to"><option value="">—</option></select>
    </label>

    <label>تعداد اپیزود، حداقل
      <input type="number" id="f-ep-min" min="0" inputmode="numeric">
    </label>
    <label>حداکثر
      <input type="number" id="f-ep-max" min="0" inputmode="numeric">
    </label>

    <label>طول اپیزود (دقیقه)، حداقل
      <input type="number" id="f-len-min" min="0" inputmode="numeric">
    </label>
    <label>حداکثر
      <input type="number" id="f-len-max" min="0" inputmode="numeric">
    </label>

    <div class="pp-actions pp-wide">
      <button type="button" id="b-random" aria-pressed="true">ترتیب تصادفی</button>
      <button type="button" id="b-alpha" aria-pressed="false">الفبایی</button>
      <label class="pp-check"><input type="checkbox" id="f-group" checked> گروه‌بندی بر اساس دسته</label>
      <button type="button" id="b-reset">پاک‌کردن فیلترها</button>
    </div>
  </form>

  <p id="pp-count" class="pp-count" aria-live="polite"></p>
  <div id="pp-results"></div>

  <div id="pp-similar-wrap" hidden>
    <h2>پادکست‌های مشابه</h2>
    <div id="pp-similar" class="pp-grid"></div>
  </div>
</section>

<script>window.PP_DATA_URL = "{{ '/podcasts.json' | relative_url }}";</script>
<script src="{{ '/assets/js/pp-search.js' | relative_url }}" defer></script>
