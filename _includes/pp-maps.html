<section class="maps" aria-labelledby="maps-h">
  <h2 id="maps-h">پادکسترها روی نقشه</h2>
  <div class="map-grid">
    <figure class="map-card"><figcaption>نقشه‌ی جهان</figcaption>{% include map-world.html %}</figure>
    <figure class="map-card"><figcaption>نقشه‌ی ایران و شهر هر پادکستر</figcaption>{% include map-iran.html %}</figure>
  </div>
  <p class="note">فقط پادکسترهایی که شهر یا کشورشان را نوشته‌اند روی نقشه می‌آیند.</p>
  <script id="pp-data" type="application/json">[{% for p in site.podcasts %}{"t":{{ p.title | jsonify }},"u":{{ p.url | relative_url | jsonify }},"c":{{ p.city | jsonify }},"k":{{ p.country | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
  <script id="pp-cities" type="application/json">{{ site.data.cities | jsonify }}</script>
  <script src="{{ '/assets/js/maps.js' | relative_url }}" defer></script>
</section>
