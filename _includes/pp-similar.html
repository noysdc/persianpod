{%- comment -%}
  در پایین layout صفحه‌ی هر پادکست (مثلاً _layouts/podcast.html) بگذار: {% include pp-similar.html %}
  از slug همان صفحه برای پیدا کردن پادکست‌های مشابه استفاده می‌کند.
{%- endcomment -%}
<link rel="stylesheet" href="{{ '/assets/css/pp-pages.css' | relative_url }}">
<section id="pp-similar-page" class="pp-similar-page" dir="rtl" hidden
         data-id="{{ page.slug }}" data-src="{{ '/podcasts.json' | relative_url }}">
  <h2>پادکست‌های مشابه</h2>
  <div class="pp-similar-grid"></div>
</section>
<script src="{{ '/assets/js/pp-similar.js' | relative_url }}" defer></script>
