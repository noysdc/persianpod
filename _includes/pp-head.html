{%- comment -%}
  این فایل را داخل <head> قرار بده: {% include pp-head.html %}
  اسکریپت کوچک اول، از چشمک‌زدن صفحه هنگام لود (روشن→تیره) جلوگیری می‌کند.
{%- endcomment -%}
<script>
  (function () {
    try {
      var t = localStorage.getItem("pp-theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="{{ '/assets/css/pp-ui.css' | relative_url }}">
<script src="{{ '/assets/js/pp-ui.js' | relative_url }}" defer></script>
