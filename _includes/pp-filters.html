<style>
/* چیدمان جست‌وجوی پیشرفته؛ مستقیم کنار خود فرم است تا همیشه (حتی با کش قدیمی) اعمال شود */
#pd-filters{--pf-gap:14px}
#pd-filters .pp-side-title{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#pd-filters .pd-count{display:none}
#pd-filters{gap:16px;padding:20px 20px 16px}
#pd-filters .pd-sep{grid-column:1/-1;margin:0}

/* ردیف‌ها: هر ردیف شبکه‌ی خودش را دارد و ستون‌ها هم‌عرض‌اند */
#pd-filters .pd-g{display:grid;grid-column:1/-1;gap:14px 16px;align-items:start;min-width:0}
#pd-filters .pd-g4{grid-template-columns:repeat(4,minmax(0,1fr))}
#pd-filters .pd-g3{grid-template-columns:repeat(3,minmax(0,1fr))}
#pd-filters .pd-cell{display:grid;gap:10px;min-width:0}
#pd-filters .pd-cell .pd-check{margin:0}
#pd-filters label,#pd-filters fieldset{display:grid;gap:6px;min-width:0;margin:0;padding:0;border:0}
#pd-filters select,#pd-filters input[type=text]{height:42px;font-size:.92rem}

/* تعداد و طول اپیزود: دو اسلایدر تک‌دایره («از» و «تا»)، راست‌به‌چپ؛ کشیدن به سمت چپ = عدد بیشتر */
#pd-filters .pd-fs{align-content:start}
#pd-filters .pd-rs{--th:22px;direction:rtl;display:grid;gap:10px}
#pd-filters .pd-rs-row{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;align-items:center;height:38px}
#pd-filters .pd-rs-f{display:flex;align-items:center;gap:6px;height:38px;min-width:0;padding:0 8px 0 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--mut);font-size:.82rem;cursor:text;transition:border-color .2s ease,box-shadow .2s ease}
#pd-filters .pd-rs-f:focus-within{border-color:#08cb00;box-shadow:0 0 0 3px rgba(8,203,0,.25)}
#pd-filters .pd-rs-f span{flex:none}
#pd-filters .pd-rs-f input[type=text]{flex:1 1 auto;width:100%;min-width:0;height:100%;padding:0;border:0;border-radius:0;background:transparent;color:var(--ink);text-align:center;outline:none}
#pd-filters .pd-rs-f input::placeholder{color:var(--ink);opacity:.55}

#pd-filters .pd-rs-track{position:relative;height:38px;min-width:0;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#pd-filters .pd-rs-rail{position:absolute;inset-inline:calc(var(--th)/2);top:50%;height:6px;transform:translateY(-50%);border-radius:999px;background:var(--line);background:color-mix(in srgb,var(--mut) 30%,transparent)}
#pd-filters .pd-rs-fill{position:absolute;top:0;bottom:0;inset-inline-start:calc(var(--fa,0)*100%);inset-inline-end:calc((1 - var(--fb,1))*100%);border-radius:999px;background:#08cb00;box-shadow:0 0 10px var(--glow-soft)}
#pd-filters .pd-rs-thumb{position:absolute;top:50%;inset-inline-start:calc((100% - var(--th))*var(--p,0));width:var(--th);height:var(--th);margin-top:calc(var(--th)/-2);box-sizing:border-box;border-radius:50%;border:3px solid var(--card);background:#08cb00;box-shadow:0 0 0 1px #08cb00,0 4px 12px var(--glow-soft);outline:none;pointer-events:none;transition:box-shadow .2s ease,transform .15s ease}
#pd-filters .pd-rs-track.drag .pd-rs-thumb{transform:scale(1.12)}
#pd-filters .pd-rs-thumb:focus-visible{box-shadow:0 0 0 1px #08cb00,0 0 0 5px rgba(8,203,0,.4)}

/* دکمه‌ها: هم‌اندازه و هم‌شکل دکمه‌های منوی بالا (حب‌های گرد ۳۸ پیکسلی) */
#pd-filters .pd-actions{grid-column:1/-1;position:sticky;bottom:12px;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-start;padding-top:4px}
#pd-filters .pd-actions .pd-apply,#pd-filters .pd-actions .pd-reset{display:inline-flex;position:static;grid-column:auto;align-items:center;justify-content:center;flex:none;width:auto;height:38px;min-height:0;margin:0;padding:0 22px;border-radius:999px;font:inherit;font-size:.92rem;line-height:1;white-space:nowrap;cursor:pointer;transition:background .2s ease,box-shadow .2s ease,border-color .2s ease}
#pd-filters .pd-actions .pd-apply{border:1px solid #08cb00;background:#08cb00;color:#0b0e0c;font-weight:700;box-shadow:0 6px 18px var(--glow-soft)}
#pd-filters .pd-actions .pd-apply:hover:not(:disabled){box-shadow:0 8px 24px var(--glow-soft);filter:brightness(1.05)}
#pd-filters .pd-actions .pd-apply:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
#pd-filters .pd-actions .pd-reset{border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:500}
#pd-filters .pd-actions .pd-reset:hover{background:var(--card);border-color:#08cb00;color:var(--ink);box-shadow:0 6px 18px var(--glow-soft)}
#pd-filters .pd-actions button:focus-visible{outline:3px solid #08cb00;outline-offset:2px}

@media(max-width:999px){
  #pd-filters .pd-g4,#pd-filters .pd-g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  #pd-filters .pd-g3 .pd-range{grid-column:1/-1}
}
@media(max-width:599px){
  #pd-filters{padding:16px 14px 14px;gap:12px}
  #pd-filters .pd-g3{grid-template-columns:1fr}
  #pd-filters select,#pd-filters input[type=text]{font-size:16px}
  #pd-filters .pd-rs{--th:28px}
  #pd-filters .pd-rs-row{grid-template-columns:78px minmax(0,1fr);height:44px}
  #pd-filters .pd-rs-f,#pd-filters .pd-rs-track{height:44px}
  #pd-filters .pd-g4{gap:10px}
  #pd-filters .pd-actions{flex-wrap:nowrap;padding:8px 0 2px;background:linear-gradient(to top,var(--card) 70%,transparent)}
  #pd-filters .pd-actions .pd-apply{flex:2 1 0;height:40px}
  #pd-filters .pd-actions .pd-reset{flex:1 1 0;height:40px;padding:0 10px}
}
</style>
<aside class="pp-filters-side" id="pd-aside" aria-label="جست‌وجوی پیشرفته">
  <button type="button" class="pd-ftoggle" id="pd-ftoggle" aria-expanded="false" aria-controls="pd-filters">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
    جست‌وجوی پیشرفته <span class="pd-fcount" id="pd-fcount" hidden></span>
  </button>
  <form id="pd-filters" class="pd-filters" autocomplete="off" role="search" aria-label="جست‌وجوی پیشرفته پادکست‌ها">
    <h2 class="pp-side-title">جست‌وجوی پیشرفته</h2>
    <p id="pd-count" class="pd-count" aria-live="polite"></p>

    <div class="pd-g pd-g4">
      <label>وضعیت
        <select id="f-status"><option value="">همه</option><option value="active">فعال</option><option value="inactive">غیرفعال</option></select>
      </label>
      <label>قسمت جدید
        <select id="f-recent"><option value="">همه</option><option value="30">۳۰ روز اخیر</option><option value="180">۶ ماه اخیر</option><option value="365">۱ سال اخیر</option></select>
      </label>
      <label>کشور
        <select id="f-country"><option value="">همه</option></select>
      </label>
      <label>شهر یا محل فعالیت
        <select id="f-city"><option value="">همه</option></select>
      </label>
    </div>

    <hr class="pd-sep">
    <div class="pd-g pd-g3">
      <fieldset class="pd-range">
        <legend>سال شروع (شمسی)</legend>
        <select id="f-yf" aria-label="از سال"><option value="">از</option></select>
        <select id="f-yt" aria-label="تا سال"><option value="">تا</option></select>
      </fieldset>
      <fieldset class="pd-fs" data-grp="ep">
        <legend>تعداد اپیزود</legend>
        <div class="pd-rs" data-min="0" data-max="300" data-step="5">
          <div class="pd-rs-row" data-k="lo">
            <label class="pd-rs-f"><span>از</span><input type="text" id="f-emin" inputmode="numeric" placeholder="۰" aria-label="حداقل اپیزود"></label>
            <div class="pd-rs-track">
              <span class="pd-rs-rail"><span class="pd-rs-fill"></span></span>
              <span class="pd-rs-thumb" role="slider" tabindex="0" aria-label="حداقل اپیزود" aria-valuemin="0" aria-valuemax="300" aria-valuenow="0"></span>
            </div>
          </div>
          <div class="pd-rs-row" data-k="hi">
            <label class="pd-rs-f"><span>تا</span><input type="text" id="f-emax" inputmode="numeric" placeholder="۳۰۰+" aria-label="حداکثر اپیزود"></label>
            <div class="pd-rs-track">
              <span class="pd-rs-rail"><span class="pd-rs-fill"></span></span>
              <span class="pd-rs-thumb" role="slider" tabindex="0" aria-label="حداکثر اپیزود" aria-valuemin="0" aria-valuemax="300" aria-valuenow="300"></span>
            </div>
          </div>
        </div>
      </fieldset>
      <fieldset class="pd-fs" data-grp="len">
        <legend>طول هر اپیزود (دقیقه)</legend>
        <div class="pd-rs" data-min="0" data-max="120" data-step="5">
          <div class="pd-rs-row" data-k="lo">
            <label class="pd-rs-f"><span>از</span><input type="text" id="f-lmin" inputmode="numeric" placeholder="۰" aria-label="حداقل دقیقه"></label>
            <div class="pd-rs-track">
              <span class="pd-rs-rail"><span class="pd-rs-fill"></span></span>
              <span class="pd-rs-thumb" role="slider" tabindex="0" aria-label="حداقل دقیقه" aria-valuemin="0" aria-valuemax="120" aria-valuenow="0"></span>
            </div>
          </div>
          <div class="pd-rs-row" data-k="hi">
            <label class="pd-rs-f"><span>تا</span><input type="text" id="f-lmax" inputmode="numeric" placeholder="۱۲۰+" aria-label="حداکثر دقیقه"></label>
            <div class="pd-rs-track">
              <span class="pd-rs-rail"><span class="pd-rs-fill"></span></span>
              <span class="pd-rs-thumb" role="slider" tabindex="0" aria-label="حداکثر دقیقه" aria-valuemin="0" aria-valuemax="120" aria-valuenow="120"></span>
            </div>
          </div>
        </div>
      </fieldset>
    </div>

    <hr class="pd-sep">
    <div class="pd-g pd-g4">
      <label>نام سازنده یا میزبان
        <input type="text" id="f-creator" placeholder="مثلاً: نام میزبان">
      </label>
      <label>موضوع یا برچسب
        <input type="text" id="f-tag" placeholder="مثلاً: تاریخ، نجوم">
      </label>
      <label>زبان
        <select id="f-lang"><option value="">همه</option></select>
      </label>
      <div class="pd-cell">
        <label>مرتب‌سازی
          <select id="f-sort">
            <option value="random">تصادفی</option>
            <option value="alpha">الفبایی</option>
            <option value="eps">بیشترین اپیزود</option>
            <option value="new">تازه‌ترین شروع</option>
          </select>
        </label>
        <label class="pd-check"><input type="checkbox" id="f-group" checked> گروه‌بندی بر اساس دسته</label>
      </div>
    </div>

    <div class="pd-actions">
      <button type="button" id="pd-apply" class="pd-apply">نمایش پادکست‌ها</button>
      <button type="button" id="f-reset" class="pd-reset">پاک‌کردن</button>
    </div>
  </form>
</aside>

<script>
(function(){
  function toEn(s){return String(s).replace(/[\u06F0-\u06F9]/g,function(d){return d.charCodeAt(0)-1776}).replace(/[\u0660-\u0669]/g,function(d){return d.charCodeAt(0)-1632})}
  function parse(v){var m=toEn(v).match(/\d+/);return m?parseInt(m[0],10):null}
  var syncs=[];
  [].slice.call(document.querySelectorAll("#pd-filters .pd-rs")).forEach(function(box){
    var mn=+box.dataset.min,mx=+box.dataset.max,st=+box.dataset.step;
    var S={lo:mn,hi:mx},busy=false,rows={};
    [].slice.call(box.querySelectorAll(".pd-rs-row")).forEach(function(r){
      rows[r.dataset.k]={
        k:r.dataset.k,text:r.querySelector("input[type=text]"),track:r.querySelector(".pd-rs-track"),
        rail:r.querySelector(".pd-rs-rail"),thumb:r.querySelector(".pd-rs-thumb")
      };
    });
    function clamp(v){return Math.min(Math.max(v,mn),mx)}
    function frac(v){return (v-mn)/(mx-mn)}
    function paint(){
      ["lo","hi"].forEach(function(k){
        var R=rows[k],p=frac(S[k]);
        R.thumb.style.setProperty("--p",p);R.thumb.setAttribute("aria-valuenow",S[k]);
        /* ناحیه‌ی انتخاب‌شده سبز می‌شود: برای «از» از دستگیره تا انتها، برای «تا» از ابتدا تا دستگیره */
        R.rail.style.setProperty("--fa",k==="lo"?p:0);R.rail.style.setProperty("--fb",k==="lo"?1:p);
      });
    }
    function sync(){
      if(busy)return;
      var a=parse(rows.lo.text.value),b=parse(rows.hi.text.value);
      S.lo=a==null?mn:clamp(a);S.hi=b==null?mx:clamp(b);
      if(S.lo>S.hi)S.lo=S.hi;
      paint();
    }
    function setText(el,v){if(el.value!==v){el.value=v;el.dispatchEvent(new Event("input",{bubbles:true}))}}
    function commit(){
      busy=true;
      setText(rows.lo.text,S.lo<=mn?"":String(S.lo));
      setText(rows.hi.text,S.hi>=mx?"":String(S.hi));
      busy=false;paint();
    }
    function setVal(k,v){
      v=clamp(Math.round(v/st)*st);
      if(k==="lo")S.lo=Math.min(v,S.hi);else S.hi=Math.max(v,S.lo);
      commit();
    }
    /* موقعیت اشاره‌گر -> مقدار؛ راست‌به‌چپ: هرچه به چپ‌تر، عدد بیشتر */
    function valAt(R,x){
      var r=R.track.getBoundingClientRect(),th=R.thumb.offsetWidth,w=r.width-th;
      var rtl=getComputedStyle(R.track).direction==="rtl";
      var f=w>0?((rtl?r.right-th/2-x:x-r.left-th/2)/w):0;
      f=Math.min(Math.max(f,0),1);
      return clamp(Math.round((mn+f*(mx-mn))/st)*st);
    }
    Object.keys(rows).forEach(function(k){
      var R=rows[k],dragging=false;
      R.track.addEventListener("pointerdown",function(e){
        if(e.pointerType==="mouse"&&e.button!==0)return;
        dragging=true;
        try{R.track.setPointerCapture(e.pointerId)}catch(_){}
        R.track.classList.add("drag");
        setVal(k,valAt(R,e.clientX));
        e.preventDefault();
      });
      R.track.addEventListener("pointermove",function(e){if(dragging)setVal(k,valAt(R,e.clientX))});
      function end(){
        if(!dragging)return;dragging=false;R.track.classList.remove("drag");
        try{R.thumb.focus({preventScroll:true})}catch(_){}
      }
      R.track.addEventListener("pointerup",end);R.track.addEventListener("pointercancel",end);
      R.thumb.addEventListener("keydown",function(e){
        var cur=S[k],v=null;
        if(e.key==="ArrowLeft"||e.key==="ArrowUp")v=cur+st;      /* چپ = بیشتر */
        else if(e.key==="ArrowRight"||e.key==="ArrowDown")v=cur-st;
        else if(e.key==="Home")v=mn;else if(e.key==="End")v=mx;
        if(v==null)return;
        e.preventDefault();setVal(k,v);
      });
      R.text.addEventListener("input",sync);
    });
    syncs.push(sync);sync();
  });
  function all(){syncs.forEach(function(f){f()})}
  window.PPRangeSync=all;
  var form=document.getElementById("pd-filters");
  if(form)form.addEventListener("reset",function(){setTimeout(all,0)});
  window.addEventListener("load",all);
})();
</script>
