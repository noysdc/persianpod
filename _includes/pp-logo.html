  لوگو و بنر متحرک. مسیرها را مطابق فایل‌های خودت عوض کن.

  <img src="{{ '/assets/img/persianpod-logo.webp' | relative_url }}"
       alt="لوگوی پرشین‌پاد" width="48" height="48" decoding="async">
