# برای افزودن آموزش جدید: یک بلوک مثل بلوک‌های پایین به انتهای همین فایل اضافه کن (فاصله‌ها را دست نزن).

- title: "گیت؛ مرجع آموزش آنلاین و یادگیری مهارت‌های جدید"
  url: "https://git.ir/"
  image: "/assets/img/learn/l-74832630e7.webp"
  description: "گیت یک مرجع آموزشی گسترده با دوره‌های متنوع در زمینه‌هایی مثل برنامه‌نویسی، طراحی، تدوین ویدیو، هوش مصنوعی و مهارت‌های فردی است. برای کسانی که دنبال یادگیری جدی و دسترسی به دوره‌های متنوع هستند، منبعی ارزشمند و کاربردی است. گیت امکان دانلود ویدیوها و زیرنویس‌ها را هم ارائه می‌کند؛ بنابراین اگر دوره‌ها را پیش از قطعی اینترنت دانلود کرده باشید، می‌توانید در زمان قطع دسترسی به اینترنت هم آن‌ها را تماشا کنید."
  source: "گیت"
  tags: ["یادگیری", "دوره‌های آموزشی", "مهارت‌آموزی", "تدوین ویدیو", "طراحی", "برنامه‌نویسی"]

- title: "آرون سورکین: از ایده تا فیلمنامه؛ شخصیت‌پردازی، دیالوگ و روایت"
  url: "https://git.ir/masterclass-aaron-sorkin-teaches-screenwriting/"
  image: "/assets/img/learn/l-f4333914c0.webp"
  description: "دوره‌ی آرون سورکین، فیلمنامه‌نویس برنده‌ی اسکار، درباره‌ی اصول فیلمنامه‌نویسی برای سینما و تلویزیون است. در این مجموعه، از پیدا کردن و آزمودن ایده‌ی داستانی و ساخت شخصیت تا طراحی صحنه، نوشتن دیالوگ‌های اثرگذار، بازنویسی و ارائه‌ی فیلمنامه را یاد می‌گیرید. بخشی از دوره نیز به بررسی نمونه‌ها و روند کار اتاق نویسندگان سریال «The West Wing» اختصاص دارد."
  source: "گیت"
  tags: ["فیلمنامه‌نویسی", "داستان‌پردازی", "شخصیت‌پردازی", "دیالوگ", "روایت"]

- title: "دیوید ممت: هنر درام‌نویسی؛ از ساخت پیرنگ تا خلق صحنه‌های مؤثر"
  url: "https://git.ir/masterclass-david-mamet-teaches-dramatic-writing/"
  image: "/assets/img/learn/l-b8487102aa.webp"
  description: "دیوید ممت، نمایشنامه‌نویس و فیلمنامه‌نویس برنده‌ی جایزه‌ی پولیتزر، در این دوره سراغ سازوکار درام می‌رود: پیدا کردن ایده، پرداخت شخصیت، طراحی و پیشبرد پیرنگ، نوشتن دیالوگ و ساخت صحنه‌هایی که هرکدام نقشی ضروری در داستان دارند. او برای توضیح روش‌هایش، بخش‌هایی از نمایشنامه‌های «American Buffalo» و «Glengarry Glen Ross» را نیز تحلیل می‌کند."
  source: "گیت"
  tags: ["درام‌نویسی", "داستان‌پردازی", "ساختار روایت", "پیرنگ", "دیالوگ"]

