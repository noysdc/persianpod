# منبع واحد دسته‌ها و زیردسته‌های پرشین‌پاد
# فرم، فیلترها، صفحه‌ی دسته‌ها و اسکریپت اعتبارسنجی همه از همین فایل می‌خوانند.
#
# قواعد:
#  - هر پادکست دقیقاً یک دسته‌ی اصلی دارد (category) و صفر تا سه زیردسته (subcategories).
#  - زیردسته باید حتماً زیر همان دسته‌ی اصلیِ پادکست تعریف شده باشد.
#  - در فایل پادکست، نام دسته و زیردسته عیناً مثل این فایل نوشته می‌شود.
#  - دسته‌ی «موضوع» اینجاست؛ «قالب» (مصاحبه، کتاب صوتی...) فیلد جدای format است (_data/formats.yml).
#  - برای افزودن زیردسته فقط یک مورد به فهرست همان دسته اضافه کن.
#  - برای تغییر نام/ادغام، به _data/category_migrations.yml قاعده اضافه کن و
#    python3 tools/migrate_categories.py را اجرا کن (اول بدون --apply).
#  - بعد از هر تغییر: python3 tools/validate_podcasts.py

