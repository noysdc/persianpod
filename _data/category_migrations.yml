# قاعده‌های انتقال از نام‌های قدیمی به ساختار جدید (برای tools/migrate_categories.py)
# بعد از اجرای موفق و commit می‌توانی این فایل را نگه داری یا خالی کنی.

# دسته‌ی اصلیِ ناموجود -> دسته‌ی معتبر
categories:
  داستانی و فرهنگی: مستند و روایت
  جامعه و فرهنگ: مستند و روایت

# هر قاعده: زیردسته‌ی قدیمی (در دسته‌ی قدیمی) -> زیردسته‌ی جدید.
# to می‌تواند نام زیردسته (همان دسته)، [دسته, زیردسته] (انتقال)، یا null (حذف + بررسی دستی) باشد.
