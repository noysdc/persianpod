  - {from: [سبک زندگی و سلامت, خانواده و فرزندپروری],   to: [روانشناسی, "روابط، خانواده و فرزندپروری"]}
  - {from: [روانشناسی, روابط و خانواده],                to: "روابط، خانواده و فرزندپروری"}
  - {from: [سبک زندگی و سلامت, انگیزشی و بهره‌وری],     to: [آموزش و مهارت, مهارت‌های فردی و بهره‌وری]}
  - {from: [آموزش و مهارت, مهارت‌های نرم],              to: مهارت‌های فردی و بهره‌وری}
  - {from: [طنز و سرگرمی, فیلم و سریال],                to: [هنر, سینما و سریال]}
  - {from: [هنر, سینما و تحلیل فیلم],                   to: سینما و سریال}

